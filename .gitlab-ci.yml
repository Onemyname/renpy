# CI фазы 0 (раздел 7 ARCHITECTURE.md): schema-валидация -> lint -> build -> тесты.
# Логика живёт в CLI vn — CI-конфиг тонкий и переносимый (GitHub Actions = те же 4 команды).
# Фаза 1 добавит: renpy lint по генерату, smoke затронутых глав (xvfb), bootstrap-джобу
# «clone -> запуск ≤ 5 минут»; фаза 2 — сейв-корпус, перф-бюджеты, каналы сборки.

image: python:3.12-slim

stages: [lint, build, test]

default:
  before_script:
    - pip install --quiet -e tools/vn[dev]

lint:
  stage: lint
  script:
    - vn content lint

build:
  stage: build
  script:
    - vn build
  artifacts:
    # Аварийный режим (G4): generated каждого зелёного main доступен как артефакт
    # для vn build --use-artifact <sha>
    paths: [game/generated/]
    expire_in: 30 days

test:
  stage: test
  script:
    # Свежесть генерата из артефакта стадии build (режим без записи, G1)
    - vn content compile --check
    - python -m pytest tools/vn/tests -q
