# Nightly QA (раздел 7): полный smoke по веткам и языкам, корпус сейвов, бюджеты
# и вёрстка controller-first профилей. Ловит то, что MR-пайплайн не гоняет ради
# бюджета < 10 минут (G15).

name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  RENPY_VERSION: "8.5.3"
  RENPY_SDK: ${{ github.workspace }}/.sdk/renpy-8.5.3-sdk
  SDL_AUDIODRIVER: dummy
  PYTHONIOENCODING: utf-8

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # lfs: шрифты UI лежат в LFS; checkout БЕЗ этого
        # кладёт указатели -> сборка падает FreetypeError у игрока
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Лок ставится ПЕРВЫМ (G17): точные версии тулчейна, откат = git revert одного файла.
      # Editable следом ничего не поднимет — его >=-диапазоны уже удовлетворены локом.
      - run: pip install --quiet -r tools/vn.lock
      - run: pip install --quiet -e "tools/vn[dev]"
      # ffmpeg — видео-трек ассет-конвейера (ADR-0006): с сырцами в video_src без него сборка красная
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 ffmpeg > /dev/null

      - name: Кэш Ren'Py SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-linux

      - name: Установка SDK при холодном кэше
        run: |
          if [ ! -f "$RENPY_SDK/renpy.py" ]; then
            mkdir -p .sdk
            curl -sL -o .sdk/sdk.zip "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.zip"
            unzip -q .sdk/sdk.zip -d .sdk && rm .sdk/sdk.zip
          fi
          chmod +x "$RENPY_SDK/renpy.sh" || true

      - name: Сборка + переводы (tl генерируется из PO)
        run: |
          xvfb-run -a vn build
          vn loc import
          vn loc report

      - name: Smoke-матрица (ветки x языки)
        run: |
          xvfb-run -a vn test smoke --picks 0,0
          xvfb-run -a vn test smoke --picks 0,1 --lang en
          xvfb-run -a vn test smoke --picks 1
          xvfb-run -a vn test smoke --picks 0,0 --lang pseudo

      # Тур по экранам и покрытие ветвления — в nightly, а не в ci: каждый прогон
      # поднимает движок под xvfb (десятки секунд), а MR-пайплайн держим под 10
      # минут (G15). Гейты структурные, поэтому падение здесь читается однозначно:
      # экран не открылся / ветка playtest-главы не пройдена.
      - name: Экраны и покрытие ветвления (vn test screens|paths)
        run: |
          xvfb-run -a vn test screens
          xvfb-run -a vn test paths --picks 0,0 --picks 0,1 --picks 1 --picks ch90:

      # Пересмотр сцен (ADR-0021): каждое состояние входа из графа реально
      # запускается движком. Компилятор такое не проверяет — прекондиция это
      # обещание про рантайм, а не про декларации. Место в nightly по той же
      # причине, что у тура экранов: один прогон движка под xvfb.
      - name: Пересмотр сцен из графа (vn test revisit)
        run: xvfb-run -a vn test revisit

      # Записанные прогоны: детерминизм пути и состояния между коммитами.
      # Записи живут в git (ci/fixtures/replays/), поэтому шаг воспроизводим.
      - name: Повтор записанных прогонов (vn test replay)
        run: xvfb-run -a vn test replay --all

      - name: Корпус сейвов (загрузка + миграции, G5/G6)
        run: |
          xvfb-run -a vn save check
          xvfb-run -a vn save corpus

      # Релизный путь целиком — на СВЕЖЕМ чекауте, как в release.yml.
      # Ловит регрессии вида «гейт требует генерат, которого в CI ещё нет»:
      # без этого прогона такая поломка всплыла бы только на теге.
      - name: Релизная сборка обоих флейворов (dry-run пути релиза)
        run: |
          rm -rf game/generated
          xvfb-run -a vn release build --flavor public --package win --timeout 1800
          xvfb-run -a vn release build --flavor patron --package win --timeout 1800

      - name: Скриншоты последнего прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots-${{ github.run_id }}
          path: .vncache/smoke/
          retention-days: 7

  controller-first:
    # Вёрстка геймпадных окружений (Deck / ТВ-Big Picture): без этой джобы её не
    # проверяет ни один прогон — остальные идут в десктопном профиле, и регрессия
    # «интерфейс сплющился при масштабе 1.4» или «оверлей срезан кромкой» доехала бы
    # до игрока. Гейта здесь нет намеренно: поломка видна на картинке, а не в коде
    # выхода — джоба даёт человеку диффабельные скриншоты.
    # Отдельная джоба, а не шаги в smoke: каждый прогон чистит .vncache/smoke
    # (cli.py:_autopilot_run), поэтому один прогон = один артефакт = одна джоба;
    # плюс параллельность не удлиняет ночь и красный smoke не прячет эти шоты.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # RENPY_VARIANT ЗАМЕНЯЕТ config.variants целиком (renpy/main.py:157-160),
          # а не дополняет: набор копируется из того, что подставил бы сам движок
          # при живой Steam-инициализации ($RENPY_SDK/renpy/common/00steam.rpy:1048-1059).
          - profile: steam-deck
            variant: steam_deck medium touch
          - profile: big-picture
            variant: steam_big_picture
    steps:
      - uses: actions/checkout@v4
        # lfs: шрифты UI лежат в LFS; checkout БЕЗ этого
        # кладёт указатели -> сборка падает FreetypeError у игрока
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Лок ставится ПЕРВЫМ (G17): точные версии тулчейна, откат = git revert одного файла.
      # Editable следом ничего не поднимет — его >=-диапазоны уже удовлетворены локом.
      - run: pip install --quiet -r tools/vn.lock
      - run: pip install --quiet -e "tools/vn[dev]"
      # ffmpeg — видео-трек ассет-конвейера (ADR-0006): с сырцами в video_src без него сборка красная
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 ffmpeg > /dev/null

      - name: Кэш Ren'Py SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-linux

      - name: Установка SDK при холодном кэше
        run: |
          if [ ! -f "$RENPY_SDK/renpy.py" ]; then
            mkdir -p .sdk
            curl -sL -o .sdk/sdk.zip "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.zip"
            unzip -q .sdk/sdk.zip -d .sdk && rm .sdk/sdk.zip
          fi
          chmod +x "$RENPY_SDK/renpy.sh" || true

      - name: Сборка
        run: xvfb-run -a vn build

      - name: Прогон в профиле ${{ matrix.profile }} + экраны меню
        env:
          RENPY_VARIANT: ${{ matrix.variant }}
          # Экраны, которые прохождение сцен не открывает: именно на них видно
          # масштаб интерфейса, рельсу навигации и отступ от кромки (gui.overscan_pad).
          VN_AUTOPILOT_SCREENS: main_menu,preferences,gallery,chapter_select
        run: xvfb-run -a vn test smoke --picks 0,0

      - name: Скриншоты профиля ${{ matrix.profile }} (смотрит человек)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-shots-${{ matrix.profile }}-${{ github.run_id }}
          path: .vncache/smoke/
          retention-days: 7

  corpus:
    # Утверждения о масштабе проверяются измерением, а не рассуждением (G19, 7.6):
    # синтетический корпус строится ВНЕ репозитория, и по нему гоняется весь конвейер —
    # assets build -> content lint -> compile -> повторный compile (идемпотентность
    # генерата) -> модель памяти, с бюджетами и числами в логе.
    # В nightly, а не в ci: это лишний прогон движка и тысяча энкодов на каждый пуш при
    # бюджете MR-пайплайна < 10 минут (G15). Отдельная джоба, а не шаги в smoke:
    # корпусу не нужны ни сборка репозитория, ни переводы, ни сейв-фикстуры — он сам
    # себе проект, и красный smoke не должен прятать измерения, которые читает человек.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # lfs: корпус копирует game/framework и gui/ шаблоном из репозитория, а
        # шрифты UI лежат в LFS; с указателями вместо шрифтов прогон движка
        # (build-bridge разбирает сцены корпуса) падает FreetypeError
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Лок ставится ПЕРВЫМ (G17): точные версии тулчейна, откат = git revert одного файла.
      # Editable следом ничего не поднимет — его >=-диапазоны уже удовлетворены локом.
      - run: pip install --quiet -r tools/vn.lock
      - run: pip install --quiet -e "tools/vn[dev]"
      # ffmpeg — видео-мастера корпуса (--videos) и их транскод; xvfb/libgl1 — build-bridge
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 ffmpeg > /dev/null

      - name: Кэш Ren'Py SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-linux

      - name: Установка SDK при холодном кэше
        run: |
          if [ ! -f "$RENPY_SDK/renpy.py" ]; then
            mkdir -p .sdk
            curl -sL -o .sdk/sdk.zip "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.zip"
            unzip -q .sdk/sdk.zip -d .sdk && rm .sdk/sdk.zip
          fi
          chmod +x "$RENPY_SDK/renpy.sh" || true

      # Масштаб вдвое выше целевого для проекта (ARCHITECTURE.md: «20+ глав, 300+ сцен»):
      # линейность конвейера видна, а ночь не съедается. Замер на macOS arm64 (7.6
      # приводит ряд 100 -> 2000 -> 7000 сцен): 600 сцен / 400 образов / 2 видео — 4,8 с.
      # --videos 2 намеренно: без них видео-ветку корпуса (мастер ffmpeg -> транскод)
      # не прогоняет ни один тест — pytest-корпус собирается без видео.
      - name: Корпус масштаба + измерительный прогон конвейера
        run: xvfb-run -a vn test corpus --scenes 600 --images 400 --videos 2 --lines 8 --vars 100
