# CI (раздел 7 ARCHITECTURE.md): schema/lint -> build (компиляция сцен через
# build-bridge) -> renpy lint -> тесты. Вся логика — в CLI vn, конфиг тонкий.
# Headless-режима у Ren'Py нет (G23) — движок гоняется под xvfb-run.

name: ci

# Триггер — ЛЮБАЯ ветка, не только main: иначе работа в feature-ветке едет без
# проверок, а первый прогон случается уже после слияния (ровно так и вышло с
# fix/critical-gaps-and-handbook). `branches: ['**']` матчит ветки и НЕ матчит
# теги — иначе на теге v* ci дублировал бы release.yml.
# pull_request не нужен: голова PR — это тоже push в ветку этого репозитория,
# и она уже покрыта. Форки (единственный непокрытый случай) для приватного
# репозитория одного владельца неактуальны; появятся — вернуть pull_request
# с гардом head.repo.full_name != github.repository, иначе прогон удвоится.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Пуш «поверх» предыдущего отменяет его прогон: очередь не копится на активной ветке.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RENPY_VERSION: "8.5.3"          # обязан совпадать с пином renpy_sdk в project.yaml
  RENPY_SDK: ${{ github.workspace }}/.sdk/renpy-8.5.3-sdk
  SDL_AUDIODRIVER: dummy
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # lfs: шрифты UI лежат в LFS; checkout БЕЗ этого
        # кладёт указатели -> сборка падает FreetypeError у игрока
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Лок ставится ПЕРВЫМ (G17): точные версии тулчейна, откат = git revert одного файла.
      # Editable следом ничего не поднимет — его >=-диапазоны уже удовлетворены локом.
      - run: pip install --quiet -r tools/vn.lock
      - run: pip install --quiet -e "tools/vn[dev]"
      - run: vn content lint

  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        # lfs: шрифты UI лежат в LFS; checkout БЕЗ этого
        # кладёт указатели -> сборка падает FreetypeError у игрока
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Лок ставится ПЕРВЫМ (G17): точные версии тулчейна, откат = git revert одного файла.
      # Editable следом ничего не поднимет — его >=-диапазоны уже удовлетворены локом.
      - run: pip install --quiet -r tools/vn.lock
      - run: pip install --quiet -e "tools/vn[dev]"
      # ffmpeg — видео-трек ассет-конвейера (ADR-0006): с сырцами в video_src без него сборка красная
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 ffmpeg > /dev/null

      - name: Кэш Ren'Py SDK (пин G18)
        uses: actions/cache@v4
        with:
          path: .sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-linux

      - name: Установка SDK при холодном кэше
        run: |
          if [ ! -f "$RENPY_SDK/renpy.py" ]; then
            mkdir -p .sdk
            curl -sL -o .sdk/sdk.zip "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.zip"
            unzip -q .sdk/sdk.zip -d .sdk && rm .sdk/sdk.zip
          fi
          chmod +x "$RENPY_SDK/renpy.sh" || true

      - name: vn build (ассеты + компиляция сцен через build-bridge)
        run: xvfb-run -a vn build

      - name: Свежесть say-id и ledger (гейт G8 — устаревший текст не доедет до переводчиков)
        run: xvfb-run -a vn loc keys --check

      - name: renpy lint по framework и генерату
        run: xvfb-run -a bash "$RENPY_SDK/renpy.sh" . lint

      # Решение о подстановке 4K-варианта принимает движок, а не наш конвейер:
      # без этой джобы мы могли бы годами отгружать @2-ассеты, которых никто не видит.
      - name: Оверсэмпл подтверждён движком (ADR-0012)
        run: xvfb-run -a vn test oversample --scale 2

      # Мобильный канал: на каждый пуш идёт только арифметика по game/ — секунды
      # против часа gradle, который упал бы на том же самом. Шаг обязан стоять ПОСЛЕ
      # vn build: на пустом game/ и потолок канала, и модель памяти зелены всегда,
      # то есть гейт был бы ложно-зелёным. --bundle — строгое надмножество: к потолку
      # канала добавляется пофайловый лимит fast-follow пакета Play.
      - name: Предпосылки мобильной поставки (vn release android preflight)
        run: vn release android preflight --bundle

      # RAPT (тулчейн Android) и piper (TTS) на раннере отсутствуют. RAPT в принципе
      # ставится командой (vn release android setup sdk --download-rapt), но в CI это
      # бессмысленно: ~700 МБ Android SDK на каждый пуш и, главное, подписанный APK
      # требует ключа подписи — то есть секрета в раннере. Это отдельное решение,
      # а не побочный эффект гейта (39-platforms.md §2.1). piper — ручная установка.
      # Проверяется
      # ровно одно, и это единственное, что здесь вообще проверяемо: команда есть в
      # установленном пакете, отвечает НЕнулевым кодом и называет отсутствующий
      # тулчейн — а не падает трейсбеком и не делает вид, что собрала.
      # Все вызовы — миллисекунды: тулчейн проверяется до всякой работы (android
      # build зовёт status ДО vn build, voice tts — resolve_tts до записи в assets_src).
      # --backend piper у tts обязателен: без пина команда возьмёт первый доступный
      # бэкенд и запишет синтез мастерами в assets_src (LFS-зона).
      - name: Отсутствие внешних тулчейнов диагностируется честно (Android/TTS)
        run: |
          log="${RUNNER_TEMP:-/tmp}/toolchain.log"   # вне рабочего дерева: ниже идут гейты по репозиторию
          must_fail() {           # $1 — что обязано быть в выводе, дальше сама команда
            want="$1"; shift
            if "$@" > "$log" 2>&1; then
              echo "::error::«$*» вернула 0 — тулчейна нет, а команда молчит"; cat "$log"; exit 1
            fi
            grep -q "$want" "$log" || {
              echo "::error::«$*» упала, не назвав $want — по выводу непонятно, что делать"
              cat "$log"; exit 1; }
          }
          must_fail RAPT vn release android status
          must_fail RAPT vn release android build --timeout 1
          must_fail piper vn voice tts ch01 --backend piper --regenerate-drafts

      - name: Свежесть генерата (режим без записи, G1)
        run: xvfb-run -a vn content compile --check

      # Из tools/vn, а не из корня: набор импортирует себя как пакет
      # (test_verify_regressions: from tests.test_compile import BASE_OUTPUTS), а это
      # работает только когда tools/vn на sys.path. `python -m pytest tools/vn/tests`
      # из корня даёт ModuleNotFoundError: No module named 'tests' — локально такой
      # прогон не воспроизводится ничем, потому что разработчик запускает из tools/vn.
      - name: pytest (юнит + e2e с движком)
        working-directory: tools/vn
        run: xvfb-run -a python -m pytest tests -q

      - name: Артефакт generated (аварийный режим G4)
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ github.sha }}
          path: game/generated/
          retention-days: 30
