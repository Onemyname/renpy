schema: storage@1
# Логические хранилища сырцов (G21): манифесты в git ссылаются на ИМЯ хранилища,
# физика задаётся здесь и меняется одним коммитом. Локальные переопределения —
# .vnstorage.local.yaml (в .gitignore): например, другой путь к NAS на вашей машине.
#
# Переход на облако = замена type: file на type: s3 — манифесты не трогаются:
#   default: {type: s3, endpoint: "https://s3.eu-central-1.backblazeb2.com", bucket: "vn-assets"}
storages:
  default: {type: file, path: "~/vn-assets-store"}
