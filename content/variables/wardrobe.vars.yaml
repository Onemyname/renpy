schema: vars@1
# Гардероб (ADR-0013): значение переменной = имя варианта слоя в shots@1.
# Послойные шоты выбирают вариант по ней (атрибут <layer>_auto), поэтому выбор
# наряда игроком переживает сейв/rollback штатно, без кода в сценах.
store: g
vars:
  mira_outfit:
    type: str
    default: school
    doc: "Наряд Миры на послойных шотах; значения = варианты слоя (school/casual)"
    since: 2
