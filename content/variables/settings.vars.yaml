schema: vars@1
# Настройки игрока, живущие вне движковых preferences (C9: плоская модель
# persistent.vn_*). Дефолты эмитятся в generated/state/defaults.gen.rpy.
store: persistent
vars:
  vn_quality_cap:
    type: int
    default: null
    doc: "Потолок качества текстур: null = авто (потолок сборки), 1 = без @N-вариантов (00_core/095_quality.rpy)"
    since: 2
  vn_ui_scale:
    type: str
    default: null
    doc: "Масштаб интерфейсных кеглей: null = авто (крупный на Steam Deck/Big Picture), 'normal' = 1.0, 'large' = крупный (20_ui/scale.rpy)"
    since: 2
