schema: ui_panels@1
# Генерируемые UI-панели (ADR-0009). Ren'Py не рисует скругления, мягкие тени и
# обводки на Solid — им нужна картинка. Здесь они ОБЪЯВЛЯЮТСЯ, а конвейер рисует
# 9-patch в game/assets/ui/<id>.webp и эмитит Frame-образы vn_frame_<id>.
#
#   правка радиуса/цвета -> vn build -> новый вид, бинарей в git нет
#   в стилях: background vn_frame_<id>   (никаких путей и пикселей в вёрстке)
#
# Значения цветов держите согласованными с палитрой gui.rpy.
#
# Все размеры здесь — ВИРТУАЛЬНЫЕ пиксели (render.screen). Конвейер сам рисует
# оверсэмпл-варианты <id>@N.webp (render.classes.ui.variants, ADR-0012), умножая
# на N радиус, обводку и тень: на 4K панель не растягивается, а перерисовывается,
# поэтому углы и 1px-обводка остаются острыми. Ссылок на @N в вёрстке нет.
#
# ВАЖНО (геометрия 9-patch): Borders = radius + max(blur + |dy|, border.width),
# а элемент не может быть меньше 2*Borders — иначе движок сожмёт фон и вёрстка
# «сплющится». Минимальный размер каждой панели печатает эмиттер в
# generated/registry/ui_frames.gen.rpy. Для кнопок держите тень скромной
# (blur <= 12), для больших панелей можно щедрее.

panels:
  # ── Выборы: покой / наведение / уже выбранный ранее вариант ───────────────
  choice:
    radius: 14
    fill: {from: "#1c1c20f2", to: "#141417f2"}
    border: {color: "#ffffff14", width: 1}
    shadow: {color: "#00000073", blur: 10, dy: 3}
    doc: "Кнопка выбора в покое"

  choice_hover:
    radius: 14
    fill: {from: "#2b2b33f7", to: "#1e1e24f7"}
    border: {color: "#c94f7c8c", width: 1}
    shadow: {color: "#00000091", blur: 12, dy: 4}
    doc: "Кнопка выбора под курсором/фокусом"

  choice_chosen:
    radius: 14
    fill: "#141417d9"
    border: {color: "#ffffff0f", width: 1}
    doc: "Вариант, уже выбранный в прошлом прохождении (i.chosen)"

  # ── Чипы: мелкие кнопки, которым панель choice велика по геометрии ────────
  # Вкладка галереи и кнопка просмотрщика — это 29-31 px высоты. Панели
  # choice/choice_hover требуют 54-60 px, то есть вдвое больше самой кнопки:
  # взять их — гарантированно сплющить фон. Поэтому объявлена своя пара с
  # той же заливкой и обводкой (чтобы читалась как часть системы выборов),
  # но с малым радиусом и почти прижатой тенью: Borders = 8 + (2+1) = 11,
  # минимум 22x22 — умещается в реальную высоту с запасом.
  chip:
    radius: 8
    fill: {from: "#1c1c20f2", to: "#141417f2"}
    border: {color: "#ffffff14", width: 1}
    shadow: {color: "#00000073", blur: 2, dy: 1}
    doc: "Мелкая кнопка-чип в покое (вкладка галереи, кнопка просмотрщика)"

  chip_active:
    radius: 8
    fill: {from: "#2b2b33f7", to: "#1e1e24f7"}
    border: {color: "#c94f7c8c", width: 1}
    shadow: {color: "#00000091", blur: 2, dy: 1}
    doc: "Чип под курсором/фокусом или выбранная вкладка"

  # ── Общие поверхности интерфейса ──────────────────────────────────────────
  panel:
    radius: 18
    fill: "#111114f2"
    border: {color: "#ffffff12", width: 1}
    shadow: {color: "#00000099", blur: 28, dy: 10}
    doc: "Панель меню/настроек/сохранений"

  slot:
    radius: 10
    fill: "#17171bf2"
    border: {color: "#ffffff0f", width: 1}
    doc: "Слот сохранения"

  toast:
    radius: 12
    fill: "#1c1c20f7"
    border: {color: "#ffffff1a", width: 1}
    # Тень мягче, чем у панелей меню: Borders = radius + max(blur+|dy|, обводка),
    # то есть 12 + 8 = 20, а минимальный размер потребителя = 2*Borders = 40 px.
    # Тост — одна строка (~50 px с паддингами), и при тени 20/6 (Borders 38)
    # движок сжимал бы фон: скругления схлопывались в кашу. Это единственная
    # панель, у которой геометрия задана высотой потребителя, а не наоборот.
    shadow: {color: "#000000a6", blur: 6, dy: 2}
    doc: "Всплывающее уведомление"
