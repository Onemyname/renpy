schema: qa_screens@1

# Тур автопилота по экранам (vn test screens, ночная джоба controller-first, deck-kit).
# Правило отбора: сюда попадает экран, который ИГРОК открывает сам и который
# прохождение сцен НЕ открывает — то есть всё, что иначе ломается незамеченным.
# Экран, объявленный здесь и отсутствующий в игре (или наоборот), — ошибка гейта.
screens:
  - name: main_menu
    why: точка входа; ломается при любой правке рельсы, wordmark и гейтов «Продолжить»
  - name: preferences
    why: самый плотный экран (ползунки, сегменты качества и масштаба, синхронизация ачивок)
  - name: gallery
    why: сетка растёт с контентом; проверяет чипы категорий и превью шотов (ADR-0010/0013)
  - name: achievements
    why: карточки с прогрессом и спойлер-правило «скрытая неполученная = ???»
  - name: history
    why: вьюпорт с подсказкой управления; ловит парные ключи подсказок (kbd/pad)
  - name: chapter_select
    why: карточки глав с гейтом владения паком и предложением DLC в оверлее Steam
  - name: load
    why: слоты сохранений со скриншотами; ломается при смене имени слота и save_name
  - name: language_picker
    why: список языков из пакетов loc/po/*; пустой список = игрок заперт в одном языке
  - name: vn_content_unavailable
    why: экран «сцена недоступна» — единственный выход при разъехавшихся id (G7)
  - name: story_flow
    why: карта главы — раскладка считается из графа, ломается при правке flow.gen.rpy (ADR-0021)
  - name: story_node_menu
    why: >-
      модалка узла карты; в туре ИМЕННО потому, что «открывается только кликом» её
      уже один раз вывело из проверок — и она уехала на три необъявленных стиля,
      то есть падала исключением при клике по любому узлу. Аргумент — выпущенный
      id (G7: переименованию не подлежит)
    kwargs: {scene_id: ch01_s030}

# Экраны игры, которых в туре нет НАМЕРЕННО. Каждая запись — с причиной, иначе гейт
# «экран есть, но никто его не проверяет» превратится в свалку исключений.
ignore_defined:
  # Контракты движка: их вёрстку задаёт Ren'Py, у нас только оформление.
  - say
  - choice
  - notify
  - input                 # свободного ввода в игре нет вовсе (ADR-0016)
  - file_menu
  - save
  - confirm
  # Компоненты: сами по себе не открываются, живут внутри других экранов.
  - navigation
  # Пункты навигации и её хвост — ОДИН список на оба контекста (рельса игрового
  # меню и колонна главного). Открываются только через navigation и main_menu,
  # поэтому в туре бессмысленны: kind без хозяина не задать, а без него экран
  # рисует пункты не в той композиции.
  - vn_nav_items
  - vn_nav_tail
  - vn_button
  - vn_panel
  - vn_scrim
  - vn_modal_dialog
  - vn_pref_slider
  - vn_save_slot
  - vn_chapter_card
  - vn_gal_cell
  - vn_ach_card
  - vn_quick_menu         # оверлей поверх диалога, снимается кадрами сцен
  - vn_game_menu
  - gallery_viewer        # открывается только из ячейки галереи, с аргументом
  - vn_flow_node          # узел карты главы, рисуется внутри story_flow
  - vn_flow_cluster       # подложка фазы главы, часть раскладки story_flow
  - vn_flow_plan          # подвал карты с планом прохождений
  # Оверлеи сборки и платформы: гейтят себя сами (флейвор, бета-ветка Steam).
  - vn_build_overlay
  - vn_beta_overlay
  # Дев-зона: в дистрибутив не попадает (options.rpy: 90_debug -> None).
  - vn_debug_hotkeys
  - vn_debug_jump
  # Экран краха: показывается движком через suppress_underlay, показать его туром
  # нельзя, и проверяется он отдельным гард-тестом (test_crash_handler.py).
  - _exception
