      плейсхолдер» одновременно с двенадцатью файлами, утверждающими «значения
      нет вовсе», нельзя. Исправлено 26 утверждений; смысловое различие
      сохранено там, где оно нужно, — `appid: null` остаётся описанным как
      валидное состояние «Steam выключен во всех сборках» (на нём стоят тесты),
      а нынешнее 480 описано как плейсхолдер чужого приложения.

      Тестом это не покрыто и покрыть нечем: утверждение вида «в файле стоит
      число N» проверяемо, но таких утверждений в доке десятки, и заморозить их
      значит запретить правки. Класс закрывается иначе — единой точкой правды:
      весь разбор Steam-статуса теперь в docs/decisions/owner-decisions.md §2, а
      остальные файлы ссылаются на неё вместо пересказа.

