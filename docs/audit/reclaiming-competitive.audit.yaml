      Гейт из двух тестов: символьная ссылка обязана резолвиться в существующий
      символ модуля, а в вычищенных файлах номера строк не отрастают (список
      файлов заморожен и растёт по мере чистки). Оба проверены мутацией.

      Гейт сразу нашёл три дефекта вне зоны задачи, и они тоже исправлены:
      ARCHITECTURE.md дважды ссылалась на `memory.py: _character_cost` (такого
