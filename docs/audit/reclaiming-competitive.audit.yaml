  RTL-049:
    title: "(P0) Карта главы рисовала прямую цепочку вместо развилки: ребро в обход сцены уходило насквозь под её карточкой"
    category: correctness
    evidence:
      - "100_story_graph.rpy: layers() ставит слой = длине самого долгого пути от входа, поэтому в цепочке с пропуском (ch01: s010 -> s020 -> s030 плюс s010 -> s030) в каждой колонке ровно один узел; grid() при rows_max=1 даёт всем узлам y=0, а connectors() вёл ребро от середины источника к середине цели — то есть ровно по центрам карточек"
      - "отказ измерен на кадре, снятом САМИМ движком (vn test screens): в каждом промежутке карты ch01 горела ОДНА строка пикселей, а рёбер через промежуток проходило ДВА. Ребро в обход второй сцены невидимо целиком: видимые обрезки побитово совпадали с коридорами цепочки, а под карточкой линию скрывал непрозрачный slot.webp (альфа 242/255). Игрок не мог узнать, что из первой сцены есть второй путь"
      - "то же в ch73 — QA-главе packs/qa_flow/chapters/ch73_hidden, ЗАВЕДЁННОЙ ради этой топологии: ADR-0021 §6 перечисляет «пропускаемые сцены» среди проверяемых. Топология в корпусе была, проверки её изображения не было ни одной"
      - "класс шире пропуска. На пересечении (два узла колонки ведут в два узла следующей) все четыре ребра давали РАЗНЫЕ наборы сегментов и при этом ни одного своего пикселя — то есть проверка «наборы различны» этот класс не ловит. Несколько пунктов меню в одну сцену рисовались одной линией (живые данные: ch70_s040 -> s050 двумя выходами; ТРИ пункта ch72_s010 -> s020, где выбранная сумма открывает или закрывает скрытую сцену). Ребро «не вперёд» рисовалось обрубком в 2 px справа от источника, утверждая переход ВПЕРЁД"
      - "разрыв в сети: grep по tools/vn/tests не давал ни одного упоминания connectors/grid/layers — проверялась МОДЕЛЬ графа, а не её изображение. vn test screens карту открывает и снимает кадр, но его докстринг честно говорит «гейт структурный, а не пиксельный» (ADR-0019): обе лжи он сфотографировал и отчитался зелёным"
    implementation:
      - game/framework/00_core/100_story_graph.rpy
      - game/framework/20_ui/screens/story_flow.rpy
      - docs/adr/0021-story-flow-projections.md
    tests:
      - tools/vn/tests/test_story_map.py
    status: CLOSED
    note: >
      Лечение — точки перегиба в пропущенных колонках (классика слоевых
      раскладок): точка занимает такой же слот, как карточка, поэтому колонка
      становится многорядной (развилка выглядит развилкой), а каждое звено лежит
      в коридоре между колонками, где карточек нет по построению. Три детали
      обязательны, и каждая найдена измерением, а не рассуждением: ширина у
      точки перегиба та же, что у карточки (с нулевой её звено растягивалось на
      всю колонку и излом попадал в чужую карточку); ломаная идёт СКВОЗЬ перегиб
      (иначе линия рвётся ровно на ширину карточки и объезд выглядит двумя
      обрубками); излом выдаётся слотом коридора, а не серединой промежутка
      (иначе два косых ребра рисуют одну вертикаль на всю длину).

      Норма дописана в ADR-0021 — её отсутствие и было причиной: §3 говорил
      только про раскраску конфликтов, а раскладке предъявлялось единственное
      требование «без ручных координат». Инвариант пиксельный: у каждого ребра
      обязан быть отрезок, которого не рисует никто другой.

      Осознанная плата: сквозное ребро добавляет в колонку ряд и сдвигает
      карточки главы (в ch01 — 2 узла из 3). Обещание «узлы не прыгают между
      сборками» было сильнее правды и ДО этой правки (вставка сцены в цепочку
      сдвигала всё ниже по потоку на колонку) — формулировки в докстринге
      layers() и в шапке экрана исправлены.

