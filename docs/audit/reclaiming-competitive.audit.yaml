  RTL-028:
    title: "Существование зон assets_src не линтуется (класс «молчаливого отказа»)"
    category: quality-gate
    evidence:
      - "lint.py REQUIRED_DIRS не содержит assets_src и его зон"
      - "исторический случай: код искал assets_src/audio, норма называла audio_stems — ветка не срабатывала никогда"
    status: WONT_FIX
    rationale: >
      Отсутствие зоны — легитимное состояние до появления контента (видео, голоса,
      Live2D нет и не должно быть), поэтому проверка «зона существует» либо ложно
      краснит, либо даёт предупреждение на каждый пустой каталог и зашумляет гейты,
      где сейчас 0 WARN. Класс отказа закрыт иначе: у каждой ветки конвейера есть
      тест на фактическую раскладку (например test_audio_stems_branch_copies_ogg),
      а RTL-015/RTL-016 убрали два места, где декларация молча не применялась.
      Пересмотреть — если появится третий случай «зона переименована, ветка мертва».

