      предындексации — это в тексте теперь сказано прямо.

      Что НЕ сделано намеренно: ~1900 числовых ссылок в остальных доках.
      Переписывать их все одним заходом — это правка, которую невозможно
      отревьюировать; чистка идёт по файлу за раз с добавлением его в
