      packs/ep_beach и packs/nsfw — steam_dlc_appid), больше нигде они не
      хардкодятся. Полный разбор для владельца — docs/decisions/owner-decisions.md
      §2: что работает и что нет сегодня, что придётся сделать вне репозитория
      (Steam Direct, взрослый контент, DLC как отдельные приложения, ачивки,
