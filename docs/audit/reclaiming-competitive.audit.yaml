schema: audit@1
source: >-
  docs/competitive-audit-reclaiming.md — «Конкурентный технический аудит:
  Reclaiming the Lost 0.13 BETA → наш framework» (2026-08-22),
  §5 «Повторный аудит нашего проекта» и §6 roadmap
reviewed_at: "2026-08-22"

# Статус пункта = проверяемый факт, а не запись в отчёте: CLOSED обязан назвать
# файл реализации и тест (проверяет схема audit@1), WONT_FIX — обоснование.
# Каждая находка §5 прошла независимую адверсариальную проверку до реализации;
# два громких подозрения были ОПРОВЕРГНУТЫ и в этот трекер не попали — они
# перечислены в §5.4 документа-первоисточника.
#
# Продуктовые и правовые решения остаются OPEN: их принимает владелец, а не
# инженер, и «закрыть» их правкой кода нельзя.
#
# Соглашение про CLOSED у документационных пунктов: машинного теста на «текст
# доки соответствует коду» не существует, поэтому там `tests` перечисляет то, что
# реально сторожит правку (например блок C13), а где не сторожит ничего — стоит
# пустой список и честная оговорка в note. Для таких пунктов CLOSED означает
# «правка сделана и сверена с кодом при ревью», а не «покрыта тестом».
#
# Пункты RTL-030…RTL-038 заведены по итогам адверсариального ревью самих этих
# правок (четыре независимых ревьюера по зонам): часть находок — регрессии,
# внесённые этим же заходом, и они исправлены до сдачи.
#
# Заход 2026-08-22 (вторая половина): RTL-026, RTL-027 и новый RTL-040 закрыты
# одной работой — картой главы, встроенным гайдом и пересмотром сцен как ТРЕМЯ
# проекциями одного скомпилированного графа (ADR-0021). RTL-041…RTL-043 —
# дефекты, найденные адверсариальной проверкой уже этой работы.

items:
  RTL-001:
    title: "Миграции: json-раундтрип роняет загрузку старого сейва в крэш-скрин"
    category: runtime
    evidence:
      - "020_state.rpy: snapshot() проверял тип только по ВЕРХНЕМУ уровню (_SIMPLE)"
      - "020_state.rpy: run_migrations гнал весь снапшот через json.dumps до цепочки"
      - "эмпирика: set внутри объявленного списка -> TypeError внутри label after_load"
    implementation:
      - game/framework/00_core/020_state.rpy
    tests:
      - tools/vn/tests/test_saves.py::test_snapshot_skips_value_that_breaks_json_roundtrip
    status: CLOSED
    note: >
      Оракулом «переживёт ли значение раундтрип» взят сам json (_json_safe), а не
      рекурсивная проверка типов: вторая реализация json разошлась бы с первой.
      Пропуск логируется отдельным сообщением, значение в миграции не попадает.
      Осознанная цена (названа в докстринге функции): такая переменная выпадает из
      видимости миграций, то есть починить её миграцией нельзя — только записать
      новое значение. Выбор между «миграция её не увидит» и «игрок не загрузит
      сейв» сделан в пользу первого; наблюдаемость — строка в log.txt с именем
      переменной. Приземлять факт пропуска в state.json автопилота и краснить
      vn save corpus — обсуждалось и отложено: сегодня объявленные переменные
      простые, а лишний красный гейт на легитимном контенте дороже.

  RTL-002:
    title: "Миграции: обратная запись всего снапшота портит переменные, которых миграция не касалась"
    category: runtime
    evidence:
      - "020_state.rpy: apply_snapshot получал ВЕСЬ state, а не только изменённое"
      - "эмпирика: {1: 'a'} после любой миграции возвращался как {'1': 'a'} (ключи json)"
      - "vars@1 допускает dict-default с нестроковыми ключами (yaml даёт int)"
    implementation:
      - game/framework/00_core/020_state.rpy
    tests:
      - tools/vn/tests/test_saves.py::test_migrations_write_back_only_what_changed
    status: CLOSED
    note: >
      Сравнение до/после — по канонической сериализации (json.dumps sort_keys),
      а не по значениям: иначе True и 1 считались бы одинаковыми и запись
      терялась. Нетронутая переменная остаётся в сторе тем же объектом.

  RTL-003:
    title: "Миграции: миграция за дырой в цепочке исполнялась и помечала сейв актуальным"
    category: runtime
    evidence:
      - "020_state.rpy: при number != applied+1 был только vn_log, прогон продолжался"
      - "after_load ставил vn_save_schema = applied, то есть перепрыгивал пропущенный номер"
      - "комментарий там же обещал обратное: «дыра не должна помечать сейв актуальным»"
    implementation:
      - game/framework/00_core/020_state.rpy
    tests:
      - tools/vn/tests/test_saves.py::test_migration_chain_gap_breaks_the_chain
      - tools/vn/tests/test_saves.py::test_full_chain_applies_every_step
    status: CLOSED
    note: >
      Миграция N написана под состояние после N−1, поэтому цепочка обрывается на
      первой дыре. Ветка достижима только генератом в обход сборки (непрерывность
      гарантируют компилятор и — с RTL-004 — линтер), то есть это защита в глубину.

  RTL-004:
    title: "lint не знал правил цепочки миграций: «lint зелёный => build не падает» был неверен"
    category: quality-gate
    evidence:
      - "compile.py: _collect_migrations ронял сборку на дыре/незарезервированном номере"
      - "lint.py: о миграциях не знал ничего, кроме наличия registry.yaml в REQUIRED_FILES"
      - "следствие: pre-push hook (vn content lint) пропускал ошибку до vn build"
    implementation:
      - tools/vn/src/vn/content/migrations.py
      - tools/vn/src/vn/content/lint.py
      - tools/vn/src/vn/content/compile.py
    tests:
      - tools/vn/tests/test_lint.py::test_lint_catches_migration_chain_gap
      - tools/vn/tests/test_saves.py::test_chain_validation_gap
      - tools/vn/tests/test_saves.py::test_unreserved_number
    status: CLOSED
    note: >
      Правило вынесено в content/migrations.py и вызывается обоими — переписывать
      его в линтере значило бы гарантировать расхождение (тот же приём, что с
      правилами персонажей в content/characters.py). Тексты ошибок компилятора
      сохранены дословно.

  RTL-005:
    title: "Голое имя генерата на init роняет старт свежего чекаута (NameError)"
    category: runtime
    evidence:
      - "095_quality.rpy: min(..., vn_build_max_oversampling) без getattr на init 999"
      - "имя объявлено только в game/generated/render.gen.rpy, а game/generated/ в .gitignore"
      - "persistent глобален и переживает переклон: непустой vn_quality_cap -> NameError"
      - "строка 30 того же файла уже читала это имя через getattr с дефолтом"
    implementation:
      - game/framework/00_core/095_quality.rpy
    tests:
      - tools/vn/tests/test_engine_compat.py::test_framework_reads_generated_names_defensively
    status: CLOSED
    note: >
      Нарушался заявленный принцип «пустой проект запускается и честно говорит,
      что контента нет» (010_registry.rpy). Тест сторожит класс целиком: имя
      генерата, читаемое вне функций, обязано идти через getattr.

  RTL-006:
    title: "Триггеры ачивок и галереи по переменной не догонялись после загрузки"
    category: runtime
    evidence:
      - "080_achievements.rpy: докстринги обещали проверку «после каждой смены состояния»"
      - "фактически check() зовётся только с якорей (checkpoint/beat/chapter_done)"
      - "label after_load триггеры не прогонял вовсе"
      - "сценарий: переменная выставлена в хвосте сцены -> игрок сохранился и вышел -> ачивка не выдана"
    implementation:
      - game/framework/00_core/030_flow.rpy
      - game/framework/00_core/020_state.rpy
      - game/framework/00_core/080_achievements.rpy
      - game/framework/00_core/090_gallery.rpy
    tests:
      - tools/vn/tests/test_achievements.py::test_grant_notifies_player
    status: CLOSED
    note: >
      Добавлен фасад vn.recheck_triggers(), который зовётся из after_load после
      миграций. Докстринги приведены к факту: триггер по переменной срабатывает
      на первом якоре ПОСЛЕ присваивания. Расстановку якорей по присваиваниям
      компилятором сознательно не вводили — беззвучных промежуточных состояний в
      сцене больше, чем ачивок, и каждый такой якорь стоил бы попапа.
      Отдельно рассмотрено и признано штатным: догон обновляет глобальный
      persistent-водяной знак прогресса (vn_ach_progress) фактом загрузки. Этот
      счётчик по замыслу глобальный и только растёт, а сообщается лишь то, что
      игрок фактически достиг в загруженном состоянии.

  RTL-007:
    title: "Плашка беты дёргала Steam API на каждой интеракции и в предикции"
    category: runtime
    evidence:
      - "build_overlay.rpy: $ _branch = vn_platform.beta_branch() в overlay-экране"
      - "035_platform.rpy: beta_branch() без кэша вызывал s.get_current_beta_name()"
      - "нарушение своего же правила «в выражениях экрана нет обращений к платформе» (030_flow.rpy)"
    implementation:
      - game/framework/00_core/035_platform.rpy
      - game/framework/20_ui/screens/build_overlay.rpy
    tests:
      - tools/vn/tests/test_platform.py::test_beta_branch_is_read_at_init_and_never_at_runtime
    status: CLOSED
    note: >
      Ветку выбирают в клиенте Steam — без перезапуска игры она не меняется,
      поэтому кэш на процесс корректен. Кэш живёт в «_»-переменной стора (в сейв
      не попадает, G5).

  RTL-008:
    title: "Галерея: шот с именем из двух и более атрибутов не разблокировался никогда"
    category: runtime
    evidence:
      - "090_gallery.rpy: tag, _, attr = name.partition(' ') склеивал хвост в одну строку"
      - "сравнение шло intersection с ОТДЕЛЬНЫМИ атрибутами ключа persistent._seen_images"
      - "ограничение не было зафиксировано ни в коде, ни в handbook"
    implementation:
      - game/framework/00_core/090_gallery.rpy
    tests:
      - tools/vn/tests/test_gallery.py::test_store_unlocks_shot_with_several_attributes
      - tools/vn/tests/test_gallery.py::test_store_unlocks_shot_by_tag_and_attribute
    status: CLOSED
    note: >
      Дефект был латентным: генерат сегодня даёт ровно один атрибут (ссылка шота
      без пробелов). Теперь атрибуты сверяются как подмножество показанного имени,
      то есть стор готов к расширению схемы, а элемент не может «залипнуть
      закрытым» у игрока, который кадр видел.

  RTL-009:
    title: "Галерея: второй, заброшенный канал уведомлений (_pending / take_pending)"
    category: runtime
    evidence:
      - "090_gallery.rpy: unlock(silent=False) наполнял _pending, take_pending() не вызывался нигде"
      - "фактические уведомления идут возвратом check() через vn._gallery_notify (030_flow.rpy)"
      - "handbook 15 уже фиксировал статус IMPLEMENTED / UNUSED (zero call sites)"
    implementation:
      - game/framework/00_core/090_gallery.rpy
      - docs/handbook/15-gallery.md
    tests:
      - tools/vn/tests/test_achievements.py::test_grant_notifies_player
    status: CLOSED
    note: >
      Удалены очередь, take_pending() и ставший бессмысленным параметр silent
      (значение True не использовалось нигде). Будущий вызов take_pending()
      «уведомил» бы обо всём, открытом с начала процесса. Названный тест сторожит
      именно оставшийся канал (возврат check() -> одно уведомление на тик,
      RTL-034); проверки «мёртвого кода больше нет» не существует — удаление
      держится ревью, как и любое удаление.

  RTL-010:
    title: "Состояние экрана галереи уезжало в каждый сейв и в rollback-лог"
    category: runtime
    evidence:
      - "gallery.rpy: default vn_gal_category / vn_gal_zoom — store-default'ы"
      - "SDK rollback.py (freeze/roots): в сейв попадает всё из ever_been_changed"
      - "следствие: загрузка сейва возвращала чужую вкладку, откат за вход в меню её сбрасывал"
    implementation:
      - game/framework/20_ui/screens/gallery.rpy
      - docs/handbook/15-gallery.md
    tests:
      - tools/vn/tests/test_gallery.py::test_gallery_screen_keeps_ui_state_out_of_saves
    status: CLOSED
    note: >
      Переведено в экранные переменные (default внутри screen), как уже сделано с
      variant в просмотрщике. Вкладку меняет SetScreenVariable — кнопка живёт в
      transclude-теле use vn_game_menu, и LocalVariable писала бы в контекст
      use'нутого экрана (док движка, «Data Actions»). Цена принята: вкладка и зум
      живут, пока показан экран. Префикс «_» от попадания в сейв не спасает.

  RTL-011:
    title: "Озвучка: мастер дубля в двух форматах остаётся после импорта финала"
    category: content-pipeline
    evidence:
      - "voice.py: master_path берёт ПЕРВОЕ расширение из MASTER_EXTS"
      - "_drop_stale_masters звался только из synth_drafts (TTS), но не из import_takes"
      - "vn voice validate дубль не видел: проверка сирот ключуется по объявленному stem"
    implementation:
      - tools/vn/src/vn/voice.py
    tests:
      - tools/vn/tests/test_voice.py::test_import_final_replaces_draft_master_in_other_format
      - tools/vn/tests/test_voice.py::test_import_rejects_two_versions_of_one_take
      - tools/vn/tests/test_voice.py::test_validate_two_masters_for_one_line_is_error
    status: CLOSED
    note: >
      Заявленный в аудите отказ «черновик уедет в дистрибутив» проверкой был
      ОПРОВЕРГНУТ: ветка voice_opus делает Job на каждый файл, поэтому два
      мастера одного line_id краснят vn assets build/validate и релизный гейт
      коллизией выходов. Дефект был в диагностике — поздно и не про то. Теперь
      import чистит устаревший формат, две версии в одной пачке отвергаются до
      раскладки, а validate называет проблему адресно.

  RTL-012:
    title: "C18 «сырых путей в play не существует» — норма без enforcement"
    category: quality-gate
    evidence:
      - "ARCHITECTURE.md C18 и §2.9 утверждали, что запрет держит линтер"
      - "scenes.py: строковый литерал в play/queue молча пропускался как «не разрешимый статически»"
      - "следствие: play music \"audio/bgm/foo.ogg\" проходил все гейты"
    implementation:
      - tools/vn/src/vn/content/scenes.py
    tests:
      - tools/vn/tests/test_scene_pipeline.py::test_audio_raw_path_is_c18_violation
      - tools/vn/tests/test_scene_pipeline.py::test_audio_expression_skipped
    status: CLOSED
    note: >
      Литерал разбирается существующим хелпером на ast.literal_eval (регексы по
      .rpy запрещены, G24), строгость подчинена статусу главы (G15). Сложные
      выражения по-прежнему пропускаются: voice vn.voice_path(...) в генерате и
      подобные формы легальны.

  RTL-013:
    title: "video_src@1 не валидировался схемой на пути сборки видео (брешь G16)"
    category: quality-gate
    evidence:
      - "pipeline.py: load_opts читал sidecar без реестра схем"
      - "следствие: битый YAML — трейсбек из середины сборки, незнакомый ключ — тишина"
      - "ловил это только vn content lint, а команда сборки видео проверкой не является"
    implementation:
      - tools/vn/src/vn/assets/video.py
      - tools/vn/src/vn/assets/pipeline.py
    tests:
      - tools/vn/tests/test_video.py::test_sidecar_schema_is_enforced_on_the_build_path
      - tools/vn/tests/test_video.py::test_broken_sidecar_yaml_is_an_error_not_a_traceback
    status: CLOSED

  RTL-014:
    title: "Черновой профиль энкода видео не отлавливался релизным гейтом"
    category: quality-gate
    evidence:
      - "профиль (full CRF 30/1080p, draft CRF 42/720p) пишется в mov_meta и в ключ кэша"
      - "release.py про profile не знал: видео с --profile draft проходило vn release validate"
    implementation:
      - tools/vn/src/vn/assets/video.py
      - tools/vn/src/vn/release.py
    tests:
      - tools/vn/tests/test_release.py::test_release_gate_fails_on_draft_encoded_video
    status: CLOSED
    note: >
      FAIL, а не предупреждение: черновой энкод в проданной сборке — дефект.
      Видео без mov_meta профилем не проверяется (узнать его неоткуда), эту
      ситуацию ловит проверка свежести ассетов.

  RTL-015:
    title: "Sidecar видео без своего мастера молча не применялся"
    category: content-pipeline
    evidence:
      - "pipeline.py: sidecar исключён из мастеров как sidecar и из orphan-очистки как несуществующий выход"
      - "следствие: anim.video.yaml рядом с anim2.mp4 не действовал и не ругался"
    implementation:
      - tools/vn/src/vn/assets/pipeline.py
    tests:
      - tools/vn/tests/test_assets.py::test_video_sidecar_without_master_is_an_error
    status: CLOSED
    note: >
      Найдено при верификации RTL-013 (тот же класс: молчаливый no-op в
      декларациях), исправлено вместе с ним.

  RTL-016:
    title: "Проверки раскладки сырцов зависели от наличия ffmpeg"
    category: quality-gate
    evidence:
      - "pipeline.py: голосовая ветка при отсутствии ffmpeg обнуляла список файлов до проверок пути"
      - "видео-ветка возвращалась до проверок группы, слага и sidecar"
      - "следствие: на машине без ffmpeg ошибка в декларации прятАлась за сообщением про инструмент"
      - "test_pipeline_rejects_bad_voice_layout был красным на любой машине без ffmpeg на PATH"
    implementation:
      - tools/vn/src/vn/assets/pipeline.py
    tests:
      - tools/vn/tests/test_voice.py::test_pipeline_rejects_bad_voice_layout
      - tools/vn/tests/test_assets.py::test_video_sidecar_without_master_is_an_error
    status: CLOSED
    note: >
      Конвенция пути, формат и схема проверяются по данным — инструмент им не
      нужен. Отсутствие ffmpeg по-прежнему ошибка сборки, но теперь не глушит
      остальные претензии.

  RTL-017:
    title: "vn --help печатал кириллицу кракозябрами"
    category: dx
    evidence:
      - "cli.py: перекодировка stdout жила в callback группы click"
      - "click печатает --help на этапе разбора аргументов, ДО вызова callback"
    implementation:
      - tools/vn/src/vn/cli.py
    tests:
      - tools/vn/tests/test_cli.py::test_help_is_utf8_even_when_console_asks_cp1251
    status: CLOSED
    note: >
      Перекодировка вызывается и на импорте модуля (точка входа консольного
      скрипта — vn.cli:main, то есть импорт всегда раньше разбора), и в callback:
      поток мог быть подменён после импорта (CliRunner в тестах).

  RTL-018:
    title: "voice-домен импортировал приватную функцию loc.po"
    category: dx
    evidence:
      - "voice.py: from .loc.po import _load_translations — контракт между доменами на приватном имени"
