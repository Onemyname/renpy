  RTL-046:
    title: "Переменные тестового пака НЕ должны уезжать в сборку игрока (генерат один на все флейворы)"
    category: architecture
    evidence:
      - "генерат один на все флейворы, поэтому defaults.gen.rpy содержит default ch70.path и его соседей в любой сборке"
      - "python.py: get_changes -> ever_been_changed кладёт в сейв любую изменённую переменную стора, а default — это присваивание"
      - "проверено на живом сейве (.save = zip, файл log): ch70 x6, ch71 x6, ch72 x5, ch73 x5 вхождений"
      - "тот же факт видно в снапшоте: SNAPSHOT_STORES = ('ch01','ch70','ch71','ch72','ch73','g')"
    implementation:
      - tools/vn/src/vn/content/compile.py
      - tools/vn/src/vn/release.py
    tests:
      - tools/vn/tests/test_release.py::test_unshipped_pack_vars_are_excluded_from_every_flavor
      - tools/vn/tests/test_scene_pipeline.py::test_unshipped_pack_vars_are_split_out_of_the_shipped_generat
    status: CLOSED
    rationale: >
      Три «быстрых лечения» отвергнуты, и это часть решения. Флейвор-зависимый
      генерат рвёт единую линию .rpyc (G6) и делает «одну сборку» двумя. Обычное
      init-присваивание вместо default нельзя: default сбрасывается при НОВОЙ
      игре, а присваивание нет — тестовые главы перестали бы стартовать с чистого
      состояния, ровно того, что они и проверяют. Исключение из SNAPSHOT_VARS
      само по себе ничего не даёт: в сейв переменные попадают не через наш
      снапшот, а через движок.
    note: >
      Лечение — разделение генерата плюс существующий механизм исключений.
      Объявления переменных паков вне флейворов уезжают в отдельный файл
      state/defaults_unshipped.gen.rpy, и он исключается из дистрибутива тем же
      build_id.json: exclude, которым уже исключаются NSFW-ассеты. В dev-чекауте
      файл есть — тестовые главы играбельны; в сборке его нет — сторов не
      существует. Из снапшота миграций (G5) эти переменные тоже убраны: снапшот
      про состояние ИГРЫ.

      Проверено не рассуждением, а двумя измерениями. Первое: собран public-билд,
      в архиве vn-1.0.0-win.zip нет ни .rpy, ни .rpyc этого файла (при
      defaults.gen.* на месте). Второе: движок прогнан БЕЗ этого файла и сделан
      настоящий сейв — переменных ch70…ch73 в нём не осталось (`store.ch70.path`
      и соседи исчезли, было 6/6/5/5 вхождений), сейв стал на килобайт меньше.
      Остаточные упоминания ch7x в сейве — это пиклённый реестр глав
      (VN_CHAPTERS), то есть define, одинаковый для любого неустановленного пака.

      Побочный полезный эффект: запись прогона (RTL-045) снова отличается от
      исходной ровно двумя строками — версией и датой, — а не составом состояния.

      Скомпилированные СЦЕНЫ тестовых паков не исключаются намеренно: они мертвы и
      так (installed() в релизе False), а вырезать метки, на которые ссылается
      реестр графа, значит завести класс «висячая ссылка» ради килобайтов.

