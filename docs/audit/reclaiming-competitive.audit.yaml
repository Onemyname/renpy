  RTL-024:
    title: "ADR-0008 (лицензии AI-моделей для коммерческого 18+) в статусе «предложено»"
    category: architecture
    evidence:
      - "docs/adr/0008: развилка A/B/C по restricted/unknown моделям не выбрана"
      - "авто-гейт «модель с commercial_use != allowed не участвует в релизном контенте» не реализован"
      - "релиз 1.0.0 уже выпущен"
    status: OPEN
    note: >
      Решение правовое, а не инженерное: его принимает владелец. До выбора ветки
      ассет, сгенерированный restricted-моделью, может попасть в коммерческую
      сборку без блокера. Реализация гейта — механическая работа после решения,
      но её ФОРМА зависит от варианта (при A гейт проверяет свежесть снимка
      условий, при B — простой запрет, при C — различает билд и превью), поэтому
      писать все три заранее незачем.

      Разбор развилки для владельца — docs/decisions/owner-decisions.md §1:
      фактическое состояние манифеста моделей, правовая рамка по каждой лицензии,
      три варианта с производственными последствиями, план отступления и чек-лист
      на день решения. Производство первой главы этим пунктом НЕ блокировано:
      ядро видео-конвейера целиком Apache-2.0.

  RTL-025:
