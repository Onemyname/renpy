    title: '(отозвано) union-слияние vn_story_targets: воскрешение очищенного плана walkthrough'
    category: runtime
    evidence:
    - 'Заявлено: объединение не выражает удаление, поэтому очищенные цели возвращаются при слиянии'
    - 'Опровергнуто двумя скептиками из трёх: слияние гейтится mtime ФАЙЛА, а не временем изменения поля
      (renpy/persistent.py: пропуск файлов не новее persistent_mtime), поэтому устаревшая локальная копия
      не сливается вовсе; состояние «новый mtime при старом _changed» конвейер не производит — Ren''Py
      Sync в UI не выведен (поиск по game/framework пуст). Плюс на старте вообще работает default_merge
      (см. APII-005), то есть очищенный план побеждает. Выбор задокументирован: цели walkthrough перечислены
      среди накопителей осознанно, tombstone-ов для плана нет ни у одного варианта'
    status: WONT_FIX
    rationale: 'Отказ не следует из механизма: состояния, при котором объединение вообще применяется к
      этому полю, конвейер не создаёт. Честный остаток — семантическое несоответствие (поле поддерживает
      удаление, объединение его не выражает): если в UI появятся кнопки Ren''Py Sync, регистрация «побеждает
      более новое» для vn_story_targets станет обязательной.'
