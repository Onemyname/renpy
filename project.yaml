schema: project@1
version: 0.1.5       # semver игры; патч — фиксы, НОВАЯ ГЛАВА = minor, мажор — сезон/сеттинг
save_schema: 2       # целое; бампает tech-lead при несовместимом изменении vars
min_tools: "0.1"     # минимальная версия vn для этого дерева контента
renpy_sdk: "8.5.3"   # пиннованный SDK (G18); апгрейд — отдельным PR с прогоном canary

# ── Render-профиль (ADR-0012) ───────────────────────────────────────────────
# Единственное место, где решается «в каком разрешении и формате живут ассеты».
# Конвейер это исполняет; сцены и контент о разрешениях не знают вообще.
render:
  # Виртуальная координатная сетка Ren'Py (gui.rpy: gui.init). НЕ потолок качества —
  # движок растягивает её на любой монитор. Менять нельзя без пересчёта всего UI:
  # координаты, кегли и отступы в game/framework/20_ui заданы в этих пикселях.
  screen: [1920, 1080]

  # -> config.image_cache_size_mb (эмитится в generated/render.gen.rpy).
  # ВНИМАНИЕ: у Ren'Py это ПИКСЕЛЬНЫЙ лимит, не байтовый:
  #   cache_limit = image_cache_size_mb * 1024 * 1024 // 4   (renpy/display/im.py)
  # 1024 -> 268 Мпикс. Худшая сцена 4K (фон@2 + 4 персонажа) ≈ 58 Мпикс,
  # при cache_generations: 3 бюджет сцены — 89 Мпикс. Запас ~1.5x. Проверяется
  # моделью памяти: vn assets memory.
  image_cache_mb: 1024
  cache_generations: 3

  thumb: {max_side: 512, quality: 80}

  classes:
    bg:
      # Мастер снимается в 4K ВСЕГДА, даже пока игра отгружает 1080p:
      # уменьшить можно потом, увеличить — уже никогда.
      source_min: [3840, 2160]
      variants: [1, 2]        # шипим и 1080p, и 4K; движок сам выберет по монитору
    cg:
      source_min: [3840, 2160]
      variants: [1, 2]
    spr:
      master_scale: 2         # мастер вдвое крупнее вёрстки (1200x2200 -> 600x1100)
      variants: [1, 2]
    mov:
      variants: [1]           # 4K-видео включается сменой на [1, 2]; энкод дорогой

budgets:             # перф/размер-бюджеты (G19): превышение = красная сборка
  # ПРЕДОХРАНИТЕЛИ, а не потолок игры. Билд автономный, без докачки и интернета:
  # 8–15 ГБ качественного контента — норма жанра. Цифры ловят аварию (зацикленный
  # экспорт, забытый 8K-вариант), а не ограничивают проект (ADR-0012).
  assets_total_mb: 20000     # ~20 ГБ game/assets
  generated_total_kb: 65536  # 64 МБ .rpy-генерата (≈ сотни глав)
  cold_start_s: 30           # референс — CI-раннер (llvmpipe): ~14 c; RTX — ~1 c
  video_total_mb: 8000       # суммарно game/assets/mov (ADR-0006)
  video_file_mb: 512         # один луп; 4K-клип на 30 c укладывается
flavors:             # релизные флейворы (ADR-0006): vn release build --flavor <id>
  public:            # публичный билд: без NSFW-ассетов, без раннего контента
    packs: [ep_beach]
    nsfw: false
    early_content: false
    watermark: false
  patron:            # ранний доступ подписчикам: полный контент + вотермарка build-id
    packs: [ep_beach, nsfw]
    nsfw: true
    early_content: true
    watermark: true
