[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-tools"
version = "0.1.0"
description = "Единственный CLI проекта (G1): сборка, валидация, контент-конвейер"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "blake3>=0.4",
    "Pillow>=10.0",
    "psd-tools>=1.9",
    "polib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vn = "vn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
