schema: comfyui_models@1
# Манифест моделей ComfyUI (Фаза 0, ADR-0006). Сами модели НЕ в git и не в
# vn-assets-store — это внешние зависимости конвейера, как SDK.
#
#   статус:   vn pipeline models
#   загрузка: vn pipeline models --pull          (только auth: none)
#   проверка: vn pipeline doctor
#
# size_mb — ориентир для быстрой проверки целостности (порог 50%); фактический
# размер и sha256 фиксируются после первой успешной загрузки в
# <ComfyUI>/models/.vn-models.json и сверяются при повторных прогонах.
# auth: manual = загрузка требует аккаунта/принятия лицензии (Civitai и т.п.) —
# загрузчик сознательно останавливается на этом шаге и печатает инструкцию.

models:
