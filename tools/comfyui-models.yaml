    dest: diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    source: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    size_mb: 13633
    sha256: null
    license: "Apache-2.0"
    commercial_use: allowed
    auth: none
    required: true
    role: "Wan 2.2 I2V, high-noise эксперт (первая половина шагов)"

